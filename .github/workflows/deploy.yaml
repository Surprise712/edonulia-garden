name Deploy Quartz site to GitHub Pages

on
  push
    branches
      - v5

permissions
  contents read
  pages write
  id-token write

concurrency
  group pages
  cancel-in-progress false

jobs
  build
    runs-on ubuntu-latest

    steps
      - uses actionscheckout@v6
        with
          fetch-depth 0

      - uses actionssetup-node@v6
        with
          node-version 24

      - name Cache dependencies
        uses actionscache@v5
        with
          path ~.npm
          key ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys 
            ${{ runner.os }}-node-

      - name Cache Quartz plugins
        uses actionscache@v5
        with
          path .quartzplugins
          key ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys 
            ${{ runner.os }}-plugins-

      - name Install Dependencies
        run npm ci

      - name Install Quartz plugins
        run npx quartz plugin install

      - name Build Quartz
        run npx quartz build

      - name Upload artifact
        uses actionsupload-pages-artifact@v3
        with
          path public

  deploy
    needs build
    environment
      name github-pages
      url ${{ steps.deployment.outputs.page_url }}

    runs-on ubuntu-latest

    steps
      - name Deploy to GitHub Pages
        id deployment
        uses actionsdeploy-pages@v4